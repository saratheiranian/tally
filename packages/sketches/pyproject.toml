[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tally-sketches"
version = "0.1.0"
description = "Mergeable, serializable HyperLogLog, Count-Min Sketch and Top-K for Python. Zero dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "saratheiranian", email = "ghasemisara534@gmail.com" }]
keywords = ["hyperloglog", "count-min-sketch", "heavy-hitters", "top-k", "probabilistic", "streaming", "cardinality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
bench = ["matplotlib>=3.8"]

[project.urls]
Source = "https://github.com/saratheiranian/tally/tree/main/packages/sketches"
Issues = "https://github.com/saratheiranian/tally/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tally_sketches"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
