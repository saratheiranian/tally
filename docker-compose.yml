# Local stack: `make up`. Mirrors the AWS topology (RDS Postgres, ElastiCache Redis, ECS service).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied automatically on first start (empty volume). `make reset` to re-run.
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  ingest:
    build: ./services/ingest
    environment:
      TALLY_DATABASE_URL: postgresql://tally:tally@postgres:5432/tally
      TALLY_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
