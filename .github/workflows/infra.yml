name: Infrastructure

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  contents: read
  id-token: write        # OIDC to AWS for plan (no stored keys)
  pull-requests: write   # comment the plan on the PR

defaults:
  run:
    working-directory: infra/terraform

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.54.0
      - run: tflint --init && tflint --format compact
        env:
          GITHUB_TOKEN: ${{ github.token }}   # avoids API rate limits when fetching plugins
      - name: Checkov (security policies)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true

  plan:
    # Runs once the repo has AWS configured. Settings > Variables:
    #   AWS_ROLE_ARN (GitHub OIDC role), TF_STATE_BUCKET, optionally AWS_REGION.
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != '' && vars.TF_STATE_BUCKET != ''
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Configure remote state
        run: |
          cat > backend.tf <<EOF
          terraform {
            backend "s3" {
              bucket       = "${{ vars.TF_STATE_BUCKET }}"
              key          = "tally/demo/terraform.tfstate"
              region       = "${{ vars.AWS_REGION || 'eu-west-2' }}"
              encrypt      = true
              use_lockfile = true
            }
          }
          EOF
      - run: terraform init -input=false
      - name: Find the image tag currently deployed
        id: current
        # Planning without image_tag would show every service dropping to bootstrap
        # (0 tasks). Diff against what is actually running instead.
        run: |
          TAG=$(aws ecs describe-task-definition --task-definition tally-demo-api \
                  --query "taskDefinition.containerDefinitions[?name=='api'].image | [0]" --output text 2>/dev/null \
                | sed -n 's/.*://p')
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=60s \
            -var image_tag="${{ steps.current.outputs.tag }}" -out=tfplan | tee plan.txt
      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            const body = `### Terraform plan\n<details><summary>Show</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
